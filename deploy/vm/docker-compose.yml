# ============================================================
#  bob-mind — run the whole stack on any Docker host
#  (Oracle Cloud Always Free, Hetzner, a home server, ...)
#
#  Quick start:
#      cd deploy/vm
#      cp .env.example .env      # then edit .env
#      docker compose up -d --build
#
#  Works on amd64 and arm64. Oracle Cloud Always Free is arm64
#  (Ampere A1) — the image builds natively for either.
# ============================================================
services:
  bob:
    build:
      # The Dockerfile lives in space/ and expects space/ as its context.
      context: ../../space
      dockerfile: Dockerfile
    image: bob-mind:latest
    container_name: bob-mind
    restart: unless-stopped

    # All configuration comes from .env — see .env.example.
    env_file:
      - .env

    # Hermes keeps EVERYTHING here: config.yaml, .env, sessions,
    # memories, skills, logs, plus the 9Router and OmniRouter data dirs.
    # A named volume makes it survive image rebuilds and restarts.
    volumes:
      - bob-data:/opt/data

    # Only the dashboards and the OpenAI-compatible API need this port.
    # The Telegram bot is OUTBOUND-ONLY (long polling), so it works
    # perfectly well even if this port stays closed.
    ports:
      - "${PUBLIC_PORT:-7860}:7860"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7860/healthz"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3

    # Guards the host: a runaway service gets killed instead of
    # taking the whole VM (and your SSH session) down with it.
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8g}

volumes:
  bob-data:
